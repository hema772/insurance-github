name: Salesforce CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  SFDX_API_VERSION: '63.0'

jobs:
  validate:
    name: Validate Project Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate sfdx-project.json
        run: |
          if [ ! -f sfdx-project.json ]; then
            echo "❌ sfdx-project.json not found"
            exit 1
          fi
          echo "✅ sfdx-project.json exists"

      - name: Check required directories
        run: |
          REQUIRED_DIRS=(
            "force-app/main/default/objects"
            "force-app/main/default/flows"
            "force-app/main/default/classes"
            "force-app/main/default/lwc"
          )
          for dir in "${REQUIRED_DIRS[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "❌ Missing directory: $dir"
              exit 1
            fi
          done
          echo "✅ All required directories present"

  deploy-scratch:
    name: Deploy to Scratch Org
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli
          sf --version

      - name: Create Scratch Org
        run: |
          sf org create scratch --definition-file config/project-scratch-def.json --alias test-scratch --duration-days 1 --no-namespace --wait 10

      - name: Deploy Metadata
        run: |
          sf project deploy start --target-org test-scratch --ignore-warnings

      - name: Run Apex Tests
        run: |
          sf test run local --target-org test-scratch --code-coverage --result-format human

      - name: Delete Scratch Org
        if: always()
        run: |
          sf org delete scratch --target-org test-scratch --no-prompt

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: deploy-scratch
    if: github.ref == 'refs/heads/develop'
    timeout-minutes: 30
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to Staging
        run: |
          echo "${{ secrets.STAGING_SFDX_AUTH_URL }}" > sfdx-auth.url
          sf org login sfdx-url --sfdx-url-file sfdx-auth.url --alias staging-org
          rm sfdx-auth.url

      - name: Deploy Metadata
        run: |
          sf project deploy start --target-org staging-org --ignore-warnings --test-level RunLocalTests

      - name: Run All Tests
        run: |
          sf test run local --target-org staging-org --code-coverage --result-format human

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to Production
        run: |
          echo "${{ secrets.PROD_SFDX_AUTH_URL }}" > sfdx-auth.url
          sf org login sfdx-url --sfdx-url-file sfdx-auth.url --alias prod-org
          rm sfdx-auth.url

      - name: Deploy Metadata
        run: |
          sf project deploy start --target-org prod-org --ignore-warnings --test-level RunLocalTests

      - name: Run All Tests
        run: |
          sf test run local --target-org prod-org --code-coverage --result-format human

      - name: Create Release Tag
        run: |
          VERSION=$(date +%Y.%m.%d)-$(git rev-parse --short HEAD)
          git tag -a "v$VERSION" -m "Release $VERSION"
          git push origin "v$VERSION"

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PMD
        run: |
          wget -q https://github.com/pmd/pmd/releases/download/pmd_releases%2F7.7.0/pmd-dist-7.7.0-bin.zip
          unzip -q pmd-dist-7.7.0-bin.zip
          echo "$PWD/pmd-bin-7.7.0/bin" >> $GITHUB_PATH

      - name: Run PMD on Apex
        run: |
          pmd-bin-7.7.0/bin/pmd check \
            -d force-app/main/default/classes \
            -R rulesets/apex/quickstart.xml \
            -f text \
            -r pmd-report.txt || true
        continue-on-error: true

      - name: Upload PMD Report
        uses: actions/upload-artifact@v4
        with:
          name: pmd-report
          path: pmd-report.txt